name: Publish dev build

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  publish-dev:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudUrl = "https://goatcorp.github.io/dalamud-distrib/latest.zip"
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri $dalamudUrl -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Restore
        run: dotnet restore DalaLenoUndercut.csproj

      - name: Build
        run: dotnet build DalaLenoUndercut.csproj -c Release --no-restore

      - name: Package dev build
        id: package
        shell: pwsh
        run: |
          $packagedZip = Get-ChildItem -Path bin -Recurse -Filter latest.zip |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1

          $zip = Join-Path $PWD "DalaLenoUndercut-dev-latest.zip"
          if ($packagedZip) {
            Copy-Item $packagedZip.FullName $zip -Force
          }
          else {
            $dll = Get-ChildItem -Path bin -Recurse -Filter DalaLenoUndercut.dll |
              Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
              Select-Object -First 1
            if (-not $dll) { throw 'Built plugin output not found.' }
            Compress-Archive -Path (Join-Path $dll.Directory.FullName '*') -DestinationPath $zip -Force
          }
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Update dev-latest prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release view dev-latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create dev-latest $env:ZIP `
              --target $env:GITHUB_SHA `
              --title "DalaLeno Undercut DEV" `
              --prerelease `
              --notes "Latest automated development build from the dev branch."
          }
          else {
            gh release upload dev-latest $env:ZIP --clobber
          }
