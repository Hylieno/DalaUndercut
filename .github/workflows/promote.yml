name: Promote dev to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or reuse promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Promotion PR already exists: #$existing"
            exit 0
          fi

          gh pr create \
            --base main \
            --head dev \
            --title "Promote dev to main" \
            --body "Promote the currently tested development branch to the stable main branch. Merge only after CI and in-game validation succeed."
